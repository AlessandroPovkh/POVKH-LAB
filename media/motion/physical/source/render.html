<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POVKH LAB PHYSICAL motion renderer</title>
  <link rel="stylesheet" href="physical.css">
</head>
<body>
  <main id="stage" class="physical-stage" role="img" aria-label="POVKH LAB physical archive materialisation frame">
    <svg class="physical-field" viewBox="0 0 1920 1080" aria-hidden="true">
      <defs>
        <pattern id="physical-grid" width="52" height="52" patternUnits="userSpaceOnUse">
          <path d="M 52 0 L 0 0 0 52" fill="none" stroke="#262626" stroke-width="1"/>
        </pattern>
        <filter id="physical-displace" x="-15%" y="-30%" width="130%" height="160%" color-interpolation-filters="sRGB">
          <feTurbulence id="physical-noise" type="turbulence" baseFrequency=".006 .028" numOctaves="1" seed="31" result="noise"/>
          <feDisplacementMap id="physical-displacement" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="B"/>
        </filter>
        <clipPath id="physical-slice-a"><rect x="152" y="315" width="1616" height="96"/></clipPath>
        <clipPath id="physical-slice-b"><rect x="152" y="455" width="1616" height="112"/></clipPath>
        <clipPath id="physical-slice-c"><rect x="152" y="616" width="1616" height="120"/></clipPath>
      </defs>

      <rect width="1920" height="1080" fill="#080808"/>
      <rect class="physical-grid" x="72" y="72" width="1776" height="936" fill="url(#physical-grid)"/>
      <path class="physical-contour" d="M-80 190 C250 96 498 292 792 165 S1376 86 2010 238"/>
      <path class="physical-contour physical-contour-two" d="M-120 884 C235 714 512 970 810 806 S1432 690 2040 890"/>

      <g class="physical-register">
        <circle class="physical-ring physical-ring-outer" cx="1478" cy="532" r="268"/>
        <circle class="physical-ring physical-ring-mid" cx="1478" cy="532" r="176"/>
        <circle class="physical-ring physical-ring-core" cx="1478" cy="532" r="42"/>
        <line class="physical-axis" x1="1126" y1="532" x2="1830" y2="532"/>
        <line class="physical-axis" x1="1478" y1="180" x2="1478" y2="884"/>
      </g>

      <g class="physical-word-field" filter="url(#physical-displace)">
        <text class="physical-word physical-word-echo" x="960" y="720" textLength="1540" lengthAdjust="spacingAndGlyphs">PHYSICAL</text>
        <text class="physical-word physical-word-main" x="960" y="700" textLength="1540" lengthAdjust="spacingAndGlyphs">PHYSICAL</text>
      </g>
      <g class="physical-slices">
        <text class="physical-word physical-slice physical-slice-a" x="960" y="700" textLength="1540" lengthAdjust="spacingAndGlyphs">PHYSICAL</text>
        <text class="physical-word physical-slice physical-slice-b" x="960" y="700" textLength="1540" lengthAdjust="spacingAndGlyphs">PHYSICAL</text>
        <text class="physical-word physical-slice physical-slice-c" x="960" y="700" textLength="1540" lengthAdjust="spacingAndGlyphs">PHYSICAL</text>
      </g>

      <g class="physical-datum">
        <path d="M122 274 V164 H232 M1688 164 H1798 V274 M1798 806 V916 H1688 M232 916 H122 V806"/>
        <path class="physical-datum-red" d="M122 164 H326 M1594 916 H1798"/>
      </g>

      <g class="physical-shards">
        <path d="M354 222 L518 286 L456 402 Z"/>
        <path d="M1128 708 L1338 646 L1262 836 Z"/>
        <path class="signal" d="M686 208 L782 164 L748 364 Z"/>
        <path class="signal" d="M1542 632 L1764 586 L1660 764 Z"/>
      </g>

      <rect class="physical-scan" x="72" y="102" width="10" height="876"/>
      <rect class="physical-hold-line" x="72" y="968" width="1776" height="3"/>
      <g class="physical-index">
        <text x="96" y="124">PVKH LAB / PHYSICAL ARCHIVE / MATERIAL 01</text>
        <text x="96" y="986">SCAN / REGISTER / MATERIALISE / HOLD</text>
        <text x="1574" y="986">OBJECT DATUM / 001</text>
      </g>
    </svg>
    <img class="physical-mark" src="../../../../assets/logo/povkh-lab-compact-reverse-transparent-outlined.svg" alt="" aria-hidden="true" data-critical="true">
  </main>
  <script src="physical.js"></script>
</body>
</html>
